services:
  - type: web
    name: moajob-gyeongseop97
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: HOST
        value: 0.0.0.0
      - key: ALLOWED_ORIGINS
        value: https://gyeongseop97.github.io
